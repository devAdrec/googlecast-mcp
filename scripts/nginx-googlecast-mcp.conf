# nginx reverse proxy for googlecast-mcp, giving it the https URL that
# Claude Desktop's custom-connector field requires.
#
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# The MCP server must be started with this domain trusted, otherwise it
# answers 421 Misdirected Request:
#
#     MCP_EXTRA_ARGS="--allow-host cast.example.com" ./scripts/service.sh install
#
# Only the MCP port (8765) is proxied. The audio port (8766) stays LAN-only —
# the speakers fetch from it directly and must not go through the proxy.

server {
    listen 443 ssl;
    http2 on;
    server_name cast.example.com;   # <-- your domain

    ssl_certificate     /etc/letsencrypt/live/cast.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cast.example.com/privkey.pem;

    location /mcp {
        proxy_pass http://192.168.1.128:8765/mcp;

        # Streamable HTTP keeps a long-lived response open and streams events.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts: an idle MCP session must not be cut off mid-stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name cast.example.com;
    return 301 https://$host$request_uri;
}
