# nginx reverse proxy for googlecast-mcp, giving it the https URL that
# Claude Desktop's custom-connector field requires.
#
# Install (matches this host's convention of vhosts in conf.d):
#   sudo cp scripts/nginx-googlecast-mcp.conf \
#           /etc/nginx/conf.d/google_cast_adrec_cloud.conf
#   sudo certbot --nginx -d google-cast.adrec.cloud
#   sudo nginx -t && sudo systemctl reload nginx
#
# The hostname must not contain an underscore: public CAs refuse to issue
# certificates for such names, so google_cast.adrec.cloud could never get one.
# *.adrec.cloud is a wildcard record, so the hyphenated name already resolves.
#
# The MCP server must be started with this domain trusted, otherwise it
# answers 421 Misdirected Request:
#
#   MCP_EXTRA_ARGS="--allow-host google-cast.adrec.cloud" \
#       ./scripts/service.sh install
#
# Only the MCP port (8765) is proxied. The audio port (8766) stays LAN-only —
# the speakers fetch from it directly and must not go through the proxy.

server {
    listen 443 ssl;
    http2 on;
    server_name google-cast.adrec.cloud;

    # Filled in by `certbot --nginx`; paths shown for reference.
    ssl_certificate     /etc/letsencrypt/live/google-cast.adrec.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/google-cast.adrec.cloud/privkey.pem;

    location /mcp {
        proxy_pass http://192.168.1.128:8765/mcp;

        # Streamable HTTP keeps a long-lived response open and streams events.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts: an idle MCP session must not be cut off mid-stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This name resolves on the public internet and the MCP server has no
    # authentication of its own: anyone who reaches /mcp can play audio in the
    # house. Restrict it to the LAN unless remote access is actually wanted.
    #   allow 192.168.0.0/16;
    #   deny  all;
}

server {
    listen 80;
    server_name google-cast.adrec.cloud;
    return 301 https://$host$request_uri;
}
