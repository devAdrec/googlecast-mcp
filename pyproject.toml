[project]
name = "googlecast-mcp"
version = "0.1.0"
description = "MCP server for discovering and controlling Google Cast (Chromecast) devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Official Model Context Protocol SDK (modelcontextprotocol/python-sdk).
    # Pinned below 2.0: a separate, unrelated "mcp" 2.0.0 exists on PyPI whose
    # layout and dependencies (httpx2, mcp-types) do not match this SDK.
    "mcp[cli]>=1.13,<2",
    "pychromecast>=14.0.0",
    # Vietnamese neural text-to-speech; no API key required.
    "edge-tts>=7.0.0",
]

[project.scripts]
googlecast-mcp = "googlecast_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/googlecast_mcp"]
